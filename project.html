  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    (function () {
      var r = document.documentElement, m = 'auto';
      try { m = localStorage.getItem('reon-theme') || 'auto'; if (localStorage.getItem('reon-grid') === '0') r.classList.add('no-grid'); } catch (e) {}
      var d = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      r.setAttribute('data-theme', d ? 'dark' : 'light');
      r.setAttribute('data-theme-mode', m);
      r.classList.add('js');
    })();
  </script>
</head>

  <canvas class="pixels" aria-hidden="true"></canvas>
